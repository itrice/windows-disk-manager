<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows Disk Manager — Disk Analysis Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">&#128190;</span>
    <div>
      <h1>Windows Disk Manager</h1>
      <p class="tagline">Disk usage analysis &amp; draft cleanup</p>
    </div>
  </div>
  <div class="topbar-right">
    <span id="statusBadge" class="badge idle">Idle</span>
    <button id="btnSettings" class="btn ghost" title="Settings">&#9881; Settings</button>
    <button id="btnScan" class="btn primary">&#9654; Scan</button>
    <button id="btnCancel" class="btn danger-ghost hidden">Stop scan</button>
  </div>
</header>

<section class="scanbar">
  <label for="rootInput">Scan root</label>
  <input id="rootInput" type="text" placeholder="e.g. C:\Users\you  or  /home/you" spellcheck="false">
  <div id="progressWrap" class="hidden progress-wrap">
    <div class="progress"><div id="progressBar"></div></div>
    <span id="progressText"></span>
  </div>
</section>

<section class="cards" id="cards"></section>

<section class="charts">
  <div class="panel">
    <h2>Top-level folders</h2>
    <div id="topLevelChart" class="hbar-list"></div>
  </div>
  <div class="panel">
    <h2>By file extension</h2>
    <div class="ext-wrap">
      <div id="extDonut" class="donut"></div>
      <div id="extLegend" class="legend"></div>
    </div>
  </div>
</section>

<section class="panel tabs-panel">
  <div class="tabs" id="tabs">
    <button data-tab="drafts" class="tab active">Drafts <span id="tabDraftCount" class="tab-count"></span></button>
    <button data-tab="largest" class="tab">Largest files</button>
    <button data-tab="old" class="tab">Old files</button>
    <button data-tab="empty" class="tab">Empty folders</button>
    <button data-tab="all" class="tab">All files</button>
    <button data-tab="activity" class="tab">Activity</button>
    <button data-tab="trash" class="tab">Local trash</button>
  </div>
  <div class="tab-toolbar" id="tabToolbar"></div>
  <div class="tab-body" id="tabBody"></div>
</section>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>
<script src="app.js"></script>
</body>
</html>
