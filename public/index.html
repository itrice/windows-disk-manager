<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows Disk Manager — Disk Analysis Dashboard</title>
<script>
  // Legacy-browser guard (Internet Explorer / engines without fetch):
  // replace the page with a short notice so users know what to install.
  (function () {
    var legacy = false;
    try {
      legacy = !!document.documentMode || !window.fetch || !window.Promise || !document.querySelector;
    } catch (e) { legacy = true; }
    if (legacy) {
      document.addEventListener('DOMContentLoaded', function () {
        var b = document.body;
        if (!b) return;
        b.innerHTML =
          '<div style="font-family:Segoe UI,Arial,sans-serif;padding:40px;max-width:640px;margin:0 auto;color:#e6edf3;background:#0e1117;min-height:100vh">' +
          '<h1 style="font-size:22px;margin:0 0 12px">Windows Disk Manager</h1>' +
          '<p style="font-size:14px;line-height:1.7;margin:0 0 12px">Your browser is too old to run the dashboard.</p>' +
          '<p style="font-size:14px;line-height:1.7;margin:0 0 12px">Please use a modern browser:<br>' +
          '&bull; Google Chrome 49+ (Chrome 109 is the last version for Windows 7)<br>' +
          '&bull; Mozilla Firefox 45+ (Firefox 115 ESR is the last version for Windows 7)<br>' +
          '&bull; Microsoft Edge</p>' +
          '<p style="font-size:13px;color:#8b98a9">The server keeps running — just refresh this page after installing a browser.</p>' +
          '</div>';
      });
    }
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">&#128190;</span>
    <div>
      <h1>Windows Disk Manager</h1>
      <p class="tagline">Disk usage analysis &amp; draft cleanup</p>
    </div>
  </div>
  <div class="topbar-right">
    <span id="statusBadge" class="badge idle">Idle</span>
    <button id="btnSettings" class="btn ghost" title="Settings">&#9881; Settings</button>
    <button id="btnScan" class="btn primary">&#9654; Scan</button>
    <button id="btnCancel" class="btn danger-ghost hidden">Stop scan</button>
  </div>
</header>

<section class="scanbar">
  <label for="rootInput">Scan root</label>
  <input id="rootInput" type="text" placeholder="e.g. C:\Users\you  or  /home/you" spellcheck="false">
  <div id="progressWrap" class="hidden progress-wrap">
    <div class="progress"><div id="progressBar"></div></div>
    <span id="progressText"></span>
  </div>
</section>

<section class="cards" id="cards"></section>

<section class="charts">
  <div class="panel">
    <h2>Top-level folders</h2>
    <div id="topLevelChart" class="hbar-list"></div>
  </div>
  <div class="panel">
    <h2>By file extension</h2>
    <div class="ext-wrap">
      <div id="extDonut" class="donut"></div>
      <div id="extLegend" class="legend"></div>
    </div>
  </div>
</section>

<section class="panel tabs-panel">
  <div class="tabs" id="tabs">
    <button data-tab="drafts" class="tab active">Drafts <span id="tabDraftCount" class="tab-count"></span></button>
    <button data-tab="largest" class="tab">Largest files</button>
    <button data-tab="old" class="tab">Old files</button>
    <button data-tab="empty" class="tab">Empty folders</button>
    <button data-tab="all" class="tab">All files</button>
    <button data-tab="activity" class="tab">Activity</button>
    <button data-tab="trash" class="tab">Local trash</button>
  </div>
  <div class="tab-toolbar" id="tabToolbar"></div>
  <div class="tab-body" id="tabBody"></div>
</section>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>
<script src="app.js"></script>
</body>
</html>
